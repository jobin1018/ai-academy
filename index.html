<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="description" content="AI Engineer Quest: a personal command center for the 30-day Applied AI Engineering program." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AI Engineer Quest</title>
    <script>
      try {
        var t = localStorage.getItem('aeq:theme');
        document.documentElement.dataset.theme = t === 'light' || t === 'system' ? t : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
